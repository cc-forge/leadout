<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="[[title]]">
  <rect width="1280" height="320" fill="[[bg]]"/>
  <rect x="0" y="0" width="12" height="320" fill="[[accent]]"/>
  <g font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="64" y="150" font-size="[[title_size]]" font-weight="700" fill="[[fg]]">[[title]]</text>
    <text x="64" y="215" font-size="32" fill="[[muted]]">[[tagline]]</text>
    <text x="64" y="270" font-size="24" fill="[[accent]]">[[slug]]</text>
  </g>
</svg>
