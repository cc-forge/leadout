# Daily repository stats by leadout.
# Appends one snapshot per day to stats.jsonl on the orphan branch `leadout-stats`,
# so the history outlives GitHub's 14-day traffic window and the default branch stays clean.
#
# Traffic (views, clones, referrers) needs a token with push/administration read access.
# The default GITHUB_TOKEN cannot read it: add an optional repository secret
# LEADOUT_TOKEN (fine-grained PAT, access to this repository only,
# "Administration: Read-only"). Without it the workflow saves public data only.
#
# GitHub disables scheduled workflows after 60 days without repository activity.
name: leadout stats

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: leadout-stats
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Prepare the data branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin leadout-stats >/dev/null; then
            git fetch --depth=1 origin leadout-stats:leadout-stats
            git worktree add stats-data leadout-stats
          else
            git worktree add --detach stats-data
            git -C stats-data checkout --orphan leadout-stats
            git -C stats-data rm -rf --quiet .
          fi

      - name: Note when traffic is not available
        env:
          HAS_TOKEN: ${{ secrets.LEADOUT_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::notice::No LEADOUT_TOKEN secret: saving public data only (traffic needs push access)."
          fi

      - name: Collect a snapshot
        env:
          GH_TOKEN: ${{ secrets.LEADOUT_TOKEN || github.token }}
        run: >
          python3 .github/leadout/stats.py collect "$GITHUB_REPOSITORY"
          --history stats-data/stats.jsonl --source actions

      - name: Push the data branch
        run: |
          cd stats-data
          git add stats.jsonl
          git commit --quiet -m "stats: $(date -u +%Y-%m-%d)"
          git push origin HEAD:leadout-stats
