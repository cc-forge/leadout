name: CI

on:
  push:
    branches: ["[[default_branch]]"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [[python_versions]]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      [[install_step]]
      - name: Test
        run: [[test_command]]
