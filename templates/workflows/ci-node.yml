name: CI

on:
  push:
    branches: ["[[default_branch]]"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Install
        run: [[install_command]]
      - name: Build
        run: npm run build --if-present
      - name: Test
        run: npm test --if-present
